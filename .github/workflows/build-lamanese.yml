name: Build fork image (lamanese)

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/lamanese/patchmon-server

jobs:
  build-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-source-code/go.mod
          cache-dependency-path: agent-source-code/go.sum

      - name: Build agent binaries
        working-directory: agent-source-code
        run: |
          set -euo pipefail
          out=../agents-prebuilt
          mkdir -p "$out"
          build() {
            goos=$1; goarch=$2; ext=${3:-}; goarm=${4:-}
            echo "Building $goos/$goarch${goarm:+ (arm v$goarm)}"
            env GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -buildvcs=false -ldflags="-s -w" \
              -o "$out/patchmon-agent-$goos-$goarch$ext" ./cmd/patchmon-agent
          }
          build linux amd64
          build linux arm64
          build linux 386
          build linux arm "" 6
          build freebsd amd64
          build windows amd64 .exe
          ls -la "$out"

      - name: Upload agent binaries
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agents-prebuilt/patchmon-agent-*
          if-no-files-found: error
          retention-days: 7

  # The collision-guard tests in internal/migrate assert that upstream migrations
  # never touch fork-owned objects; this job must be able to break the fork
  # build, especially at upstream-sync time.
  #
  # The database-backed tests (migration up/down, legacy bridge, rollback, and
  # the *_testdb_test.go files in store/ and queue/) skip themselves without
  # PM_TEST_DATABASE_URL, so the job runs a throwaway Postgres and points them
  # at it. The account must be allowed to CREATE DATABASE: the tests create one
  # scratch database per test.
  test-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchmon_test
          POSTGRES_PASSWORD: patchmon_test
          POSTGRES_DB: patchmon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchmon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-source-code/go.mod
          cache-dependency-path: server-source-code/go.sum

      - name: Run migrate package tests (with database)
        working-directory: server-source-code
        env:
          PM_TEST_DATABASE_URL: postgresql://patchmon_test:patchmon_test@localhost:5432/patchmon_test?sslmode=disable
        run: go test -count=1 ./internal/migrate/...

      - name: Run the other database-backed tests
        working-directory: server-source-code
        env:
          PM_TEST_DATABASE_URL: postgresql://patchmon_test:patchmon_test@localhost:5432/patchmon_test?sslmode=disable
        run: go test -count=1 ./internal/store/... ./internal/queue/... ./internal/reports/... ./internal/handler/...

  build-server:
    needs: [build-agents, test-migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: agents-prebuilt

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # :latest belongs exclusively to feat/remote-reboot (production);
      # feature branches only get their own branch tag.
      - name: Compute image tags
        id: tags
        run: |
          if [ "$GITHUB_REF_NAME" = "feat/remote-reboot" ]; then
            echo "tags=$IMAGE:latest,$IMAGE:feat-remote-reboot" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server-fork.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
