version: "2"

sql:
  - engine: "postgresql"
    schema: "internal/sqlc/schema"
    queries: "internal/sqlc/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          # Unqualified "timestamptz" is what sqlc 1.30 + pgx/v5 actually matches; "pg_catalog.timestamptz" never matched.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
